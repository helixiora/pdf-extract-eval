version: '3.8'

services:
  tika:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tika
    ports:
      - "127.0.0.1:9998:9998"
    command: ["-c", "/tika-config.json"]
    volumes:
      - ./tika-config.json:/tika-config.json:ro
    deploy:
      resources:
        limits:
          memory: 6g  # Total container memory limit
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9998/tika"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
