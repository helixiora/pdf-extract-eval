version: 2
updates:
  - package-ecosystem: docker
    directory: /technologies/tika
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      all-dependencies:
        patterns:
          - '*'
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: docker-compose
    directory: /technologies/tika
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      all-dependencies:
        patterns:
          - '*'
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: pip
    directory: /technologies/tika
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      all-dependencies:
        patterns:
          - '*'
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
